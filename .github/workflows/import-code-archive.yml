name: Import Project Script Archive

on:
  push:
    paths:
      - '.github/workflows/import-code-archive.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Import script artifacts
        shell: bash
        run: |
          set -euo pipefail

          rm -rf GreenClean/CORE GreenClean/SUPPORT Nostalgia/CORE VisualNovelDev

          curl --fail --location 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-4a50-8209-a09b-1a34f090e241/raw?se=2026-09-01T00%3A43%3A57Z&sp=r&sv=2026-02-06&sr=b&scid=2ea981fa-f5e8-52dc-923e-b65d6fac02b8&skoid=fe2e0858-51c5-47e9-acb7-46ebb9a0f396&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-31T23%3A30%3A22Z&ske=2026-09-01T23%3A30%3A22Z&sks=b&skv=2026-02-06&sig=jsE6swsns7I9sVggBOM9UOcCx9j7nCu/K1cCGbFiwJg%3D' -o /tmp/green.zip
          curl --fail --location 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-7660-8206-99eb-707d99e7ea26/raw?se=2026-09-01T00%3A44%3A04Z&sp=r&sv=2026-02-06&sr=b&scid=f3f7d28e-7ca0-58a6-9587-334e4cb8e6a8&skoid=fe2e0858-51c5-47e9-acb7-46ebb9a0f396&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-31T23%3A14%3A13Z&ske=2026-09-01T23%3A14%3A13Z&sks=b&skv=2026-02-06&sig=NPAeQWH2XMNQZNP4FxO1I5kMip3mPgAF8du9C0SHFYU%3D' -o /tmp/nostalgia.zip
          curl --fail --location 'https://sdmntprseasia.oaiusercontent.com/files/00000000-97cc-8207-a3b3-faca76078206/raw?se=2026-09-01T00%3A44%3A09Z&sp=r&sv=2026-02-06&sr=b&scid=b0e61162-05c8-5783-8ed3-22de0ad6db03&skoid=fe2e0858-51c5-47e9-acb7-46ebb9a0f396&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-31T23%3A18%3A53Z&ske=2026-09-01T23%3A18%3A53Z&sks=b&skv=2026-02-06&sig=uW39E7L0dVsiWbvN/zqu7gqQDsvngYeENfVcmTWxZpU%3D' -o /tmp/mixterpiece.zip
          curl --fail --location 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-7664-8209-b65d-2054c2d625db/raw?se=2026-09-01T00%3A44%3A13Z&sp=r&sv=2026-02-06&sr=b&scid=92188355-d858-595c-8779-161a2b71a5d0&skoid=fe2e0858-51c5-47e9-acb7-46ebb9a0f396&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-31T23%3A25%3A46Z&ske=2026-09-01T23%3A25%3A46Z&sks=b&skv=2026-02-06&sig=DDPViks/RjNyi72Ks2VqIL8%2B2/caM1QSdA%2BAwd%2BUXY8%3D' -o /tmp/poltergeist.zip

          unzip -q -o /tmp/green.zip -d .
          unzip -q -o /tmp/nostalgia.zip -d .
          unzip -q -o /tmp/mixterpiece.zip -d .
          unzip -q -o /tmp/poltergeist.zip -d .

          # Third-party asset/tutorial source is not part of the portfolio archive.
          rm -rf Poltergeist/Scripts/AtmosphericHouse
          rm -rf Poltergeist/Scripts/Downloaded_Assets

          echo "GreenClean: $(find GreenClean/Scripts -type f -name '*.cs' | wc -l) C# files"
          echo "Nostalgia: $(find Nostalgia/Scripts -type f -name '*.cs' | wc -l) C# files"
          echo "MixterPiece: $(find MixterPiece/Scripts -type f -name '*.cs' | wc -l) C# files"
          echo "Poltergeist: $(find Poltergeist/Scripts -type f -name '*.cs' | wc -l) C# files"

      - name: Commit imported archive
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Archive full project C# scripts'
            git push
          fi
