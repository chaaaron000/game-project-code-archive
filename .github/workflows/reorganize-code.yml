name: 코드 폴더 구조 정리

on:
  push:
    paths:
      - '.github/workflows/reorganize-code.yml'

permissions:
  contents: write

jobs:
  reorganize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 기능 기준으로 코드 재배치
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          root = Path('.')

          def move(src: Path, dst: Path):
              if src == dst:
                  return
              dst.parent.mkdir(parents=True, exist_ok=True)
              subprocess.run(['git', 'mv', str(src), str(dst)], check=True)

          def green(rel: Path) -> Path:
              p = rel.as_posix()
              name = rel.name
              if p.startswith('Blackboard/Editor/'):
                  return Path('Editor/Blackboard') / Path(p).relative_to('Blackboard/Editor')
              if p.startswith('Blackboard/'):
                  return Path('Systems/Blackboard') / Path(p).relative_to('Blackboard')
              if p.startswith('MascotReaction/Editor/'):
                  return Path('Editor/MascotReaction') / Path(p).relative_to('MascotReaction/Editor')
              if p.startswith('MascotReaction/'):
                  return Path('Systems/MascotReaction') / Path(p).relative_to('MascotReaction')
              if p.startswith('UI/'):
                  return rel
              if p.startswith('Editor/'):
                  return rel
              if p.startswith('Extension/'):
                  return Path('Common/Extensions') / Path(p).relative_to('Extension')
              if p.startswith('Utility/'):
                  if name in {'DataManager.cs', 'GameSaveData.cs'}:
                      return Path('Data/Save') / name
                  return Path('Common/Utilities') / Path(p).relative_to('Utility')
              if name in {'Card.cs','CardData.cs','CardManager.cs','DeckManager.cs'}:
                  return Path('Gameplay/Cards') / name
              if name in {'GridManager.cs','Tile.cs','TileView.cs','SimpleTileFlip.cs'}:
                  return Path('Gameplay/Grid') / name
              if name in {'GameManager.cs','GameSceneManager.cs','IntroManager.cs','SceneType.cs'}:
                  return Path('GameFlow') / name
              if name in {'SoundManager.cs','PlayButtonSound.cs'}:
                  return Path('Audio') / name
              if name == 'SettingManager.cs':
                  return Path('Settings') / name
              if name in {'FloatingText.cs','UIManager.cs'}:
                  return Path('UI') / name
              if name == 'DebugQAController.cs':
                  return Path('Debug') / name
              return Path('Common') / name

          def nostalgia(rel: Path) -> Path:
              p = rel.as_posix()
              name = rel.name
              rules = [
                  ('Challenge/', 'Gameplay/Challenge'),
                  ('Chase/', 'Gameplay/Chase'),
                  ('Editor/', 'Editor'),
                  ('Ending/', 'Gameplay/Ending'),
                  ('Entity/Expressionless/', 'AI/Expressionless'),
                  ('Entity/Sad/', 'AI/Sad'),
                  ('Entity/Smile/', 'AI/Smile'),
                  ('Entity/', 'AI/Common'),
                  ('Game Over/', 'UI/GameOver'),
                  ('Interfaces/', 'Common/Interfaces'),
                  ('Item/', 'Gameplay/Items'),
                  ('Map/', 'Gameplay/Map'),
                  ('Network/', 'Network/Core'),
                  ('Object/', 'Gameplay/Objects'),
                  ('Player/', 'Gameplay/Player'),
                  ('Save/', 'Data/Save'),
                  ('Settings/', 'Settings'),
                  ('Single/', 'Gameplay/SinglePlayer'),
                  ('Sound/', 'Audio'),
                  ('Steam/', 'Platform/Steam'),
                  ('Tutorial/', 'Gameplay/Tutorial'),
                  ('UI/', 'UI'),
                  ('Util/', 'Common/Utilities'),
                  ('Vivox/', 'Network/VoiceChat'),
              ]
              for prefix, target in rules:
                  if p.startswith(prefix):
                      return Path(target) / Path(p).relative_to(prefix.rstrip('/'))
              if name in {'GameManager.cs','GameSceneManager.cs','GameplayEventManager.cs'}:
                  return Path('GameFlow') / name
              if name == 'SelectCharacterManager.cs':
                  return Path('Network/CharacterSelection') / name
              return Path('Debug/Legacy') / name

          def mixter(rel: Path) -> Path:
              p = rel.as_posix()
              name = rel.name
              if p.startswith('Command/'):
                  return Path('Gameplay/Commands') / Path(p).relative_to('Command')
              if p.startswith('Grid/'):
                  return Path('Gameplay/Grid') / Path(p).relative_to('Grid')
              if p.startswith('Paint/'):
                  return Path('Gameplay/Paint') / Path(p).relative_to('Paint')
              if p.startswith('Stage/Editor/'):
                  return Path('Editor/Stage') / Path(p).relative_to('Stage/Editor')
              if p.startswith('Stage/'):
                  return Path('Gameplay/Stage') / Path(p).relative_to('Stage')
              if p.startswith('Editor/'):
                  return rel
              if p.startswith('UI/'):
                  return rel
              if name in {'AccessibilityDisplaySettings.cs','AccessibilityDisplaySettingsCatalogSO.cs','ColorPaletteSO.cs'}:
                  return Path('Settings/Accessibility') / name
              if name == 'GameSettingsService.cs':
                  return Path('Settings') / name
              if name in {'SoundKeys.cs','SoundLibrary.cs','SoundManager.cs'}:
                  return Path('Audio') / name
              if name == 'SceneTransitionManager.cs':
                  return Path('GameFlow') / name
              if name in {'DebugConsole.cs','LazyPersistentSingleton.cs'}:
                  return Path('Common') / name
              return Path('Debug/Legacy') / name

          def polter(rel: Path) -> Path:
              p = rel.as_posix()
              if p.startswith('Dongguk_Project/Scripts/'):
                  rel = Path(p).relative_to('Dongguk_Project/Scripts')
                  p = rel.as_posix()
              elif p.startswith('Inventory/Script/'):
                  return Path('Gameplay/Inventory') / Path(p).relative_to('Inventory/Script')
              elif p.startswith('Fonts/Script/'):
                  return Path('Legacy/Misc') / rel.name
              name = rel.name
              if p.startswith('InfiniteLoop/'):
                  return Path('Gameplay/InfiniteLoop') / Path(p).relative_to('InfiniteLoop')
              if name in {'AudioController.cs','AudioKeyController.cs'}:
                  return Path('Audio') / name
              if name in {'CustomSimplePlayerController.cs','CustomSimplePlayerUse.cs'}:
                  return Path('Gameplay/Player') / name
              if name in {'DoorOpenClose.cs','CrosslineCollider.cs','InteractionScript.cs','LockController.cs','SimpleGetItem.cs','SphereBox.cs','WatchController.cs','ClockControl.cs','KeyFrame.cs','Change.cs'}:
                  return Path('Gameplay/Interaction') / name
              if name in {'ImageSelector.cs','TextChanger.cs','StartMenu.cs'}:
                  return Path('UI') / name
              if name in {'SceneTransition.cs','StartNightScene.cs'}:
                  return Path('GameFlow') / name
              return Path('Legacy/Misc') / name

          configs = [
              ('GreenClean', green),
              ('Nostalgia', nostalgia),
              ('MixterPiece', mixter),
              ('Poltergeist', polter),
          ]

          for project, mapper in configs:
              scripts = root / project / 'Scripts'
              files = list(scripts.rglob('*.cs'))
              moves = []
              for src in files:
                  rel = src.relative_to(scripts)
                  dst = scripts / mapper(rel)
                  moves.append((src, dst))
              for src, dst in moves:
                  move(src, dst)

          # 빈 디렉터리는 Git이 추적하지 않으므로 별도 처리 불필요.
          PY

      - name: 변경 내용 커밋
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m '프로젝트 코드를 기능 단위 폴더로 재정리'
            git push
          fi
